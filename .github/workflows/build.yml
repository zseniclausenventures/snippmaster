name: Bygg Snippmaster

# Ny release lages automatisk når versjonen i package.json endres på main.
# En tag v* eller manuell kjøring bygger også.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Versjon $TAG er allerede utgitt. Bygger uten ny release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Ny versjon $TAG. Lager release etter bygget."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  mac:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bygg (signert og notarisert hvis sertifikat finnes)
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            npm run dist:mac -- -c.mac.notarize=true
          else
            echo "::warning::Ingen Apple-sertifikat i secrets. Bygger usignert."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npm run dist:mac -- -c.mac.notarize=false -c.mac.identity=null
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: snippmaster-mac
          path: dist/*.dmg

  win:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bygg installasjonsfil
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: snippmaster-win
          path: dist/*.exe

  release:
    needs: [version, mac, win]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: out/*
          draft: false
          prerelease: true
